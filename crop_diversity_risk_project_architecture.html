<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crop Diversity Risk Project Architecture</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px;
    margin: 0;
  }
  h1 {
    font-size: 18px;
    font-weight: 500;
    color: #1a1a18;
    margin: 0 0 24px;
    text-align: center;
  }
  svg { width: 100%; max-width: 860px; height: auto; }

  @media (prefers-color-scheme: dark) {
    body { background: #1c1c1a; }
    h1 { color: #e8e6de; }
  }

  /* color ramps */
  .c-teal   rect, .c-teal   circle, .c-teal   ellipse { fill: #E1F5EE; stroke: #0F6E56; }
  .c-teal   text { fill: #085041; }
  .c-purple rect, .c-purple circle, .c-purple ellipse { fill: #EEEDFE; stroke: #534AB7; }
  .c-purple text { fill: #3C3489; }
  .c-coral  rect, .c-coral  circle, .c-coral  ellipse { fill: #FAECE7; stroke: #993C1D; }
  .c-coral  text { fill: #712B13; }
  .c-blue   rect, .c-blue   circle, .c-blue   ellipse { fill: #E6F1FB; stroke: #185FA5; }
  .c-blue   text { fill: #0C447C; }
  .c-gray   rect, .c-gray   circle, .c-gray   ellipse { fill: #F1EFE8; stroke: #5F5E5A; }
  .c-gray   text { fill: #444441; }

  @media (prefers-color-scheme: dark) {
    .c-teal   rect, .c-teal   circle, .c-teal   ellipse { fill: #085041; stroke: #5DCAA5; }
    .c-teal   text { fill: #9FE1CB; }
    .c-purple rect, .c-purple circle, .c-purple ellipse { fill: #3C3489; stroke: #AFA9EC; }
    .c-purple text { fill: #CECBF6; }
    .c-coral  rect, .c-coral  circle, .c-coral  ellipse { fill: #712B13; stroke: #F0997B; }
    .c-coral  text { fill: #F5C4B3; }
    .c-blue   rect, .c-blue   circle, .c-blue   ellipse { fill: #0C447C; stroke: #85B7EB; }
    .c-blue   text { fill: #B5D4F4; }
    .c-gray   rect, .c-gray   circle, .c-gray   ellipse { fill: #444441; stroke: #B4B2A9; }
    .c-gray   text { fill: #D3D1C7; }
  }

  .label-secondary { font-size: 12px; fill: #5F5E5A; font-weight: 500; }
  @media (prefers-color-scheme: dark) { .label-secondary { fill: #B4B2A9; } }

  .t  { font-size: 14px; fill: #2C2C2A; font-family: inherit; }
  .ts { font-size: 12px; fill: #5F5E5A; font-family: inherit; }
  .th { font-size: 14px; fill: #2C2C2A; font-weight: 500; font-family: inherit; }
  @media (prefers-color-scheme: dark) {
    .t  { fill: #D3D1C7; }
    .ts { fill: #B4B2A9; }
    .th { fill: #D3D1C7; }
  }

  .arr { stroke: #888780; stroke-width: 1.5; fill: none; }
  .dashed-box { fill: none; stroke: #B4B2A9; stroke-width: 1; stroke-dasharray: 4 3; }
  @media (prefers-color-scheme: dark) { .dashed-box { stroke: #5F5E5A; } }
</style>
</head>
